services:
  qdrant:
    # matches qdrant-client==1.17.1 in pyproject.toml (client/server
    # minor versions must stay within 1 of each other). bumped from
    # v1.15.5 - NOT a safe in-place upgrade path: Qdrant removed RocksDB
    # in favor of Gridstore in v1.17, and a direct v1.15.x -> v1.17.x
    # upgrade of EXISTING storage is explicitly unsupported (one minor
    # version at a time is required, or the storage volume is left
    # mid-migration and unreadable). this bump is only safe alongside
    # wiping qdrant_storage and re-ingesting from scratch:
    #   docker compose down -v   (removes the volume too, not just the container)
    #   docker compose up -d
    #   uv run python scripts/ingest_corpus.py --all
    image: qdrant/qdrant:v1.17.1
    container_name: nyayai-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API - what corpus/uploader.py and corpus/search.py hit
      - "6334:6334"   # gRPC - not used yet, exposed in case a client needs it later
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


volumes:
  qdrant_storage: